name: Main devops pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  ci-pipeline:
    # here we import our lacl template
    uses: ./.github/workflows/node-ci-template.yaml
    with:
      image-name: "my-local-registry/secure-server-api"
      node-version: "20.x"
